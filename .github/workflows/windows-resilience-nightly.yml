name: Windows Resilience Nightly

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-resilience-nightly
  cancel-in-progress: true

jobs:
  resilience:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Prepare Windows UI assets
        working-directory: apps/windows-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build native release payload
        run: python scripts/build-windows-installer.py

      - name: Run 300 second Windows resilience checks
        run: >-
          python scripts/verify-windows-resilience.py
          --soak-seconds 300
          --report dist/windows/windows-resilience-nightly-report.json

      - name: Upload resilience evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DeskLink-Windows-resilience-${{ github.run_id }}
          path: |
            dist/windows/windows-resilience-nightly-report.json
            dist/windows/windows-release-verification.json
            dist/windows/windows-installer-manifest.json
          if-no-files-found: error
          retention-days: 30
